<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">F</span><span>FitBuddy</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/docs" target="_blank" rel="noreferrer">API Docs</a>
      <button class="ghost-button" type="button" onclick="window.print()">Print</button>
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">FitBuddy · AI fitness planning demo · General wellness only</footer>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
